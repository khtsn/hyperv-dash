<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Fleet overview · Hyper-V Dash</title>
    <link rel="stylesheet" href="/dashboard.css" />
    <script type="module" src="/dashboard.js"></script>
  </head>
  <body>
    <a href="#main" class="skip">Skip to content</a>
    <aside class="rail">
      <a class="brand" href="#fleet"><i class="mark" aria-hidden="true"></i>Hyper-V Dash</a>
      <nav aria-label="Management views">
        <p>Infrastructure</p>
        <a href="#fleet"><span aria-hidden="true">▦</span>Fleet overview</a>
        <a href="#monitoring"><span aria-hidden="true">∿</span>Monitoring</a>
        <a href="#machines"><span aria-hidden="true">▣</span>Virtual machines</a>
        <a href="#networks"><span aria-hidden="true">⇄</span>Networks &amp; IPs</a>
        <p>Deployment</p>
        <a href="#provision"><span aria-hidden="true">＋</span>Provision a VM</a>
        <a href="#library"><span aria-hidden="true">▤</span>Images &amp; profiles</a>
        <p>Operations</p>
        <a href="#jobs"><span aria-hidden="true">☷</span>Jobs</a>
        <a href="#audit"><span aria-hidden="true">≡</span>Audit log</a>
      </nav>
      <footer>
        <strong id="identity">Connecting…</strong><span id="role"></span
        ><button id="change-password" type="button" hidden>Change password</button>
        <button id="logout" type="button">Sign out</button>
      </footer>
    </aside>
    <main id="main" tabindex="-1">
      <div class="mast"><span>Management console</span><span id="live" role="status">Connecting</span></div>
      <header class="pagehead">
        <div>
          <h1 id="title">Fleet overview</h1>
          <p id="subtitle"></p>
        </div>
        <div id="actions" class="row"></div>
      </header>
      <div id="notice" class="notice" role="alert" hidden></div>
      <div id="content" aria-busy="true">Loading dashboard…</div>
    </main>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="dialog-head">
        <h2 id="modal-title"></h2>
        <button id="dismiss" type="button" aria-label="Close">Close</button>
      </div>
      <div id="sheet"></div>
    </dialog>
  </body>
</html>
